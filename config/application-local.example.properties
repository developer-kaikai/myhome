# 复制为项目根目录 .local/application-local.properties；仅本地使用，切勿提交真实凭据。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/myhome?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=YOUR_DATABASE_USER
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=YOUR_REDIS_PASSWORD
server.address=127.0.0.1
# Python: secrets.token_urlsafe(32)，必须妥善保存；更换密钥前需设计密令重加密迁移。
app.security.encryption-key=YOUR_32_BYTE_BASE64URL_KEY
app.wechat.app-id=
app.wechat.app-secret=
